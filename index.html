<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signature typography — ilghar.studio</title>
<link rel="stylesheet" href="src/signature.css">
<style>
:root{--bg:#473448;--title:#d4d2d2;--mauve:#856a8e;--mauve2:#7d5a7c;--label:#775a76;--grey:#a6a1a7;--pink:#fcb4c4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Jost,system-ui,sans-serif;color:var(--title);
 background:radial-gradient(40rem 28rem at 15% 20%,rgba(133,106,142,.55),transparent 60%),radial-gradient(36rem 30rem at 85% 80%,rgba(125,90,124,.6),transparent 60%),radial-gradient(20rem 16rem at 70% 15%,rgba(252,180,196,.18),transparent 70%),var(--bg)}
main{width:min(560px,100%);padding:40px 36px;border-radius:32px;
 background:linear-gradient(145deg,rgba(212,210,210,.16),rgba(166,161,167,.06));
 border:1px solid rgba(212,210,210,.22);
 backdrop-filter:blur(22px) saturate(120%);-webkit-backdrop-filter:blur(22px) saturate(120%);
 box-shadow:-10px -10px 28px rgba(133,106,142,.35),14px 16px 36px rgba(30,20,32,.55),inset 1px 1px 0 rgba(212,210,210,.25),inset -1px -1px 0 rgba(30,20,32,.25)}
h1{font-weight:400;letter-spacing:.06em;margin:0 0 24px;color:var(--title)}
h1::first-letter{color:var(--pink)}
#signature{background:transparent!important;box-shadow:none;border-color:rgba(212,210,210,.18)}#signature.sig{color:var(--title)!important;padding:0}
#signature .sig__label{color:var(--grey)!important;letter-spacing:.12em}
#signature .sig__input{width:100%;color:var(--title)!important;background:rgba(71,52,72,.35)!important;border:1px solid rgba(212,210,210,.18);border-radius:16px;padding:12px 16px;
 box-shadow:inset 4px 4px 10px rgba(30,20,32,.45),inset -4px -4px 10px rgba(133,106,142,.3);backdrop-filter:blur(8px)}
#signature .sig__input:focus{outline:2px solid var(--pink);outline-offset:2px}
#signature .sig__svg,#signature svg{max-width:100%;height:auto;color:var(--title)}
#signature .sig__svg path,#signature .sig__text,#signature .sig__glyph{stroke:var(--title)!important;fill:var(--title)!important;color:var(--title)!important}
#signature .sig__rule{stroke:var(--grey);background:var(--grey);opacity:.5}
#signature button,#signature .sig__replay{font:inherit;color:var(--title)!important;background:linear-gradient(145deg,rgba(133,106,142,.55),rgba(125,90,124,.35))!important;border:1px solid rgba(212,210,210,.2);border-radius:999px;padding:10px 20px;cursor:pointer;
 box-shadow:-5px -5px 12px rgba(133,106,142,.35),6px 6px 14px rgba(30,20,32,.5);backdrop-filter:blur(10px)}
#signature button:active{box-shadow:inset 4px 4px 10px rgba(30,20,32,.5),inset -4px -4px 10px rgba(133,106,142,.3)}
#signature button:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.studio{color:var(--label);margin:28px 0 0;color:var(--grey)}
#signature{--sig-canvas:transparent;--sig-plum:#d4d2d2;--sig-mauve:#a6a1a7;--sig-rose:#fcb4c4}
</style>
</head>
<body>
<main>
  <h1>Signature typography</h1>
  <div id="signature"></div>
  <p class="studio">ilghar.studio</p>
</main>
<script src="src/signature.js"></script>
<script>mountSignature(document.getElementById("signature"), { text: "ilghar.studio", dark: true });</script>
</body>
</html>
