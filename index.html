<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signature typography — ilghar.studio</title>
<link rel="stylesheet" href="src/signature.css">
<style>
:root{--canvas:#f3f1f6;--ink:#4a3a5c;--muted:#7a688c;--credit:#4a3a5c;--line:#e4dde8}
@media (prefers-color-scheme: dark){:root:not(.light){--canvas:#4a434c;--ink:#f4eef3;--muted:#e8a8bc;--credit:#e8a8bc;--line:#a394ae}}
:root.dark{--canvas:#4a434c;--ink:#f4eef3;--muted:#e8a8bc;--credit:#e8a8bc;--line:#a394ae}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);font-family:Jost,system-ui,sans-serif;color:var(--ink)}
.credit{color:var(--credit);font-family:"Nunito Sans",system-ui,sans-serif}
#theme-toggle{position:fixed;top:16px;right:16px;font:inherit;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
#theme-toggle:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
</style>
</head>
<body>
<button id="theme-toggle" type="button" aria-pressed="false" aria-label="Dark theme off">light / dark</button>
<main>
  <h1 style="font-weight:400">Signature typography</h1>
  <div id="signature"></div>
  <p class="credit">ilghar.studio</p>
</main>
<script src="src/signature.js"></script>
<script>mountSignature(document.getElementById("signature"), { text: "ilghar.studio" });</script>
<script>
(function () {
  var root = document.documentElement, key = "sig-theme", saved = null;
  try { saved = localStorage.getItem(key); } catch (e) {}
  if (saved === "dark" || saved === "light") root.classList.add(saved);
  var btn = document.getElementById("theme-toggle");
  function isDark() { return root.classList.contains("dark") || (!root.classList.contains("light") && matchMedia("(prefers-color-scheme: dark)").matches); }
  function sync() { var d = isDark(); btn.setAttribute("aria-pressed", d ? "true" : "false"); btn.setAttribute("aria-label", d ? "Dark theme on" : "Dark theme off"); }
  sync();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", sync);
  btn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.classList.remove("dark", "light"); root.classList.add(next);
    try { localStorage.setItem(key, next); } catch (e) {}
    sync();
  });
})();
</script>
</body>
</html>
